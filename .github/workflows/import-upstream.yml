name: Import MentorMind upstream

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Trung1234/mentormind-knowhow-ai.git /tmp/upstream
          rsync -a --delete             --exclude '.git'             --exclude '.github/workflows/'             /tmp/upstream/ ./

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import MentorMind upstream source"
          git push origin HEAD:main
